<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Noto+Sans+JP:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ '/assets/css/blog.css' | relative_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/blog/feed.xml' | relative_url }}">
{% seo %}
</head>
<body>

<header class="blog-header">
  <div class="blog-wrap blog-header__inner">
    <a class="blog-header__brand" href="{{ '/' | relative_url }}">KAWATA<span class="blog-header__brand-dim">.dev</span></a>
    <nav class="blog-nav">
      <a href="{{ '/blog/' | relative_url }}">Blog</a>
      <a href="{{ '/blog/tags/' | relative_url }}">Tags</a>
      <a href="{{ '/blog/archive/' | relative_url }}">Archive</a>
      <a href="{{ '/index.html' | relative_url }}">Portfolio</a>
    </nav>
  </div>
</header>

<main class="blog-wrap blog-main">
  {{ content }}
</main>

<footer class="blog-footer">
  <div class="blog-wrap blog-footer__inner">
    <span>&copy; {{ site.time | date: '%Y' }} Ken Kawata</span>
    <a href="{{ '/blog/feed.xml' | relative_url }}">RSS</a>
  </div>
</footer>

</body>
</html>
